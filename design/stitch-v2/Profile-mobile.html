<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Natally · Profile</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Nunito+Sans:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plumBlack: '#120c1c',
            cream: '#f1e8d8',
            gold: '#c9a24a',
            goldBright: '#f2ca50',
            panelDark: '#1a1226',
            panelMid: '#2a1d3d',
            borderPlum: '#3a2d50',
            borderPlumLight: '#4a3a64'
          },
          fontFamily: {
            display: ['Fraunces', 'serif'],
            smallcaps: ['Cinzel', 'serif'],
            body: ['Nunito Sans', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    body {
      background-color: #120c1c;
      color: #f1e8d8;
      font-family: 'Nunito Sans', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }
    .touch-target {
      min-height: 44px;
      min-width: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
  </style>
</head>
<body class="bg-plumBlack text-cream min-h-screen flex justify-center selection:bg-gold selection:text-plumBlack">

  <!-- Mobile viewport container (390px default canvas frame / responsive) -->
  <div class="w-full max-w-[420px] min-h-screen bg-plumBlack flex flex-col px-5 py-6 space-y-6">

    <!-- Top Bar: Title "Profile" with "Close" -->
    <header class="flex items-center justify-between pt-2 pb-1 border-b border-borderPlum">
      <h1 class="font-display text-2xl font-semibold tracking-wide text-cream">
        Profile
      </h1>
      <button type="button" aria-label="Close" class="touch-target px-3 py-2 text-sm font-smallcaps tracking-wider text-gold hover:text-goldBright transition-colors">
        Close
      </button>
    </header>

    <!-- Card: Name Robin Cheung, Email robin.realtor416@gmail.com -->
    <section class="bg-panelDark border border-borderPlum rounded-[18px] p-5 shadow-none">
      <div class="flex items-center space-x-4">
        <!-- Avatar / Emblem with Natally theme styling -->
        <div class="w-12 h-12 rounded-full border border-gold/40 bg-panelMid flex items-center justify-center flex-shrink-0 text-gold font-display text-lg">
          RC
        </div>
        <div class="flex-1 min-w-0">
          <p class="font-display text-xl text-cream font-medium tracking-normal truncate">
            Robin Cheung
          </p>
          <p class="text-sm font-body text-cream/75 truncate mt-0.5">
            robin.realtor416@gmail.com
          </p>
        </div>
      </div>
    </section>

    <!-- Balance card: "79 Cr" large with a "Top Up" gold-outlined button -->
    <section class="bg-panelDark border border-borderPlum rounded-[18px] p-5 flex items-center justify-between shadow-none">
      <div>
        <span class="block text-xs font-smallcaps tracking-widest text-gold uppercase mb-1">
          Balance
        </span>
        <div class="flex items-baseline space-x-2">
          <span class="font-display text-4xl font-normal text-goldBright tracking-tight">
            79
          </span>
          <span class="font-smallcaps text-lg text-cream/90 font-medium">
            Cr
          </span>
        </div>
      </div>
      <button type="button" class="touch-target px-5 py-2.5 rounded-[14px] border border-gold text-gold font-smallcaps text-sm tracking-wider hover:bg-gold hover:text-plumBlack transition-colors">
        Top Up
      </button>
    </section>

    <!-- Section "All transactions" -->
    <section class="space-y-4 pt-1">
      <h2 class="font-smallcaps text-xs tracking-widest text-gold uppercase">
        All transactions
      </h2>

      <!-- Transaction 1: Souvenir reading -->
      <div class="bg-panelDark border border-borderPlum rounded-[18px] p-5 space-y-4">
        <div class="flex flex-col space-y-1">
          <div class="flex items-baseline justify-between">
            <span class="font-display text-base text-cream font-medium">
              Souvenir reading
            </span>
            <span class="text-xs font-smallcaps tracking-wider text-gold font-semibold">
              +39 Cr
            </span>
          </div>
          <p class="text-xs font-body text-cream/75">
            US$0.99 · 30 October 2026 · paid
          </p>
        </div>

        <!-- Two buttons "Open your atelier" and "Souvenir PDF" -->
        <div class="grid grid-cols-2 gap-3 pt-1">
          <button type="button" class="touch-target w-full px-3 py-2.5 rounded-[12px] bg-panelMid border border-borderPlum text-cream hover:border-gold/60 text-xs font-smallcaps tracking-wider transition-colors text-center">
            Open your atelier
          </button>
          <button type="button" class="touch-target w-full px-3 py-2.5 rounded-[12px] bg-panelMid border border-borderPlum text-cream hover:border-gold/60 text-xs font-smallcaps tracking-wider transition-colors text-center">
            Souvenir PDF
          </button>
        </div>
      </div>

      <!-- Transaction 2: Exploration credits -->
      <div class="bg-panelDark border border-borderPlum rounded-[18px] p-5">
        <div class="flex items-baseline justify-between">
          <span class="font-display text-base text-cream font-medium">
            Exploration credits
          </span>
          <span class="text-xs font-smallcaps tracking-wider text-gold font-semibold">
            +40 Cr
          </span>
        </div>
        <p class="text-xs font-body text-cream/75 mt-1">
          US$0.99 · 28 October 2026 · paid
        </p>
      </div>

      <!-- Small note & Restore purchases -->
      <div class="pt-2 text-center space-y-2">
        <p class="text-xs font-body text-cream/70">
          Every purchase on your account, read from the store.
        </p>
        <div>
          <button type="button" class="touch-target text-xs font-body text-cream/85 underline hover:text-gold transition-colors py-1">
            Restore purchases
          </button>
        </div>
      </div>
    </section>

    <!-- Spacer to keep layout balanced on tall screens -->
    <div class="flex-grow"></div>

    <!-- At the very bottom a full-width "Sign out" button -->
    <footer class="pt-4 pb-2">
      <button type="button" class="touch-target w-full py-3.5 px-4 rounded-[14px] bg-panelMid border border-borderPlum text-cream hover:border-gold/50 font-smallcaps text-sm tracking-wider transition-colors">
        Sign out
      </button>
    </footer>

  </div>

</body>
</html>
