<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Natally — sign in and birth details</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400&amp;family=Nunito+Sans:wght@400;600;700&amp;display=swap">
<style>body{margin:0}a{color:#f2ca50}a:hover{color:#ffe08a}</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 28px 24px; background: #120c1c; color: #f1e8d8; font-family: 'Nunito Sans', sans-serif; display: flex; flex-direction: column; gap: 18px">
  <div style="display: flex; align-items: center; gap: 12px">
    <img src="/_blob/f481477b2f357372d16e3b3d2e1abd13" alt="" style="width: 40px; height: 40px; border-radius: 50%; border: 2px solid #8a6d2b">
    <span style="font-family: Fraunces, serif; font-size: 24px">Natally</span>
  </div>
  <sc-if value="{{stepSignIn}}" hint-placeholder-val="{{ true }}">
    <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 400; font-size: 32px; line-height: 1.15">Sign in to see your own chart</h1>
    <p style="margin: 0; font-size: 16px; line-height: 1.55; color: #d8cde6">Your chart, readings and purchases stay with your account on every device.</p>
    <button type="button" onClick="{{next}}" style="min-height: 52px; border: 1px solid #c9a24a; border-radius: 14px; background: #2a1d3d; color: #f1e8d8; font: 700 17px 'Nunito Sans', sans-serif; cursor: pointer">Continue with Google</button>
    <button type="button" onClick="{{next}}" style="min-height: 52px; border: 1px solid #5a4a72; border-radius: 14px; background: #1c1428; color: #f1e8d8; font: 700 17px 'Nunito Sans', sans-serif; cursor: pointer">Continue with phone number</button>
    <a href="Main.dc.html" style="font-size: 15px">Back to the room without signing in</a>
  </sc-if>
  <sc-if value="{{stepBirth}}" hint-placeholder-val="{{ false }}">
    <h1 style="margin: 0; font-family: Fraunces, serif; font-weight: 400; font-size: 30px; line-height: 1.15">When and where were you born?</h1>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Name Natally should use
      <input value="Aurelia" style="min-height: 48px; padding: 0 14px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif">
    </label>
    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Day<select style="min-height: 48px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif"><option>8</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Month<select style="min-height: 48px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif"><option>November</option></select></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Year<select style="min-height: 48px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif"><option>1997</option></select></label>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Birth time
      <input value="7:05 PM" style="min-height: 48px; padding: 0 14px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif">
    </label>
    <label style="display: flex; align-items: center; gap: 10px; font-size: 15px"><input type="checkbox" style="width: 22px; height: 22px">I don't know my birth time</label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 15px">Birth place
      <input value="Toronto, Ontario, Canada" style="min-height: 48px; padding: 0 14px; border: 1px solid #5a4a72; border-radius: 12px; background: #1c1428; color: #f1e8d8; font: 16px 'Nunito Sans', sans-serif">
    </label>
    <a href="Atelier.dc.html" style="display: flex; align-items: center; justify-content: center; min-height: 52px; margin-top: auto; border: 1px solid #c9a24a; border-radius: 14px; background: #2a1d3d; color: #f1e8d8; text-decoration: none; font-weight: 700; font-size: 17px">Calculate my chart</a>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { step: 'signin' }; }
  renderVals() {
    return { stepSignIn: this.state.step === 'signin', stepBirth: this.state.step === 'birth', next: () => this.setState({ step: 'birth' }) };
  }
}
</script>
</body>
</html>
